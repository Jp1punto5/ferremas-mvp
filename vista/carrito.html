<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferremas - Catálogo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- ======================================== -->
    <!-- HEADER PRINCIPAL -->
    <!-- ======================================== -->

    <header class="header-principal">

        <!-- LOGO + BOTON VOLVER -->
        <div class="contenedor-logo">

            <a href="catalogo_p.html"
            class="boton-volver">

                <i class="fa-solid fa-arrow-left"></i>

            </a>


            <img src="img/logo-ferremas.png"
                alt="Logo Ferremas"
                class="logo-ferremas">

        </div>

        <!-- TITULO -->
        <div class="contenedor-titulo">
            <h1 id="tituloCategoria"></h1>
        </div>

        <!-- CARRITO -->
        <div class="contenedor-carrito">

            <button class="boton-carrito">
                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contador-carrito">
                    0
                </span>
            </button>

        </div>

    </header>


    <!-- ======================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ======================================== -->

    <main class="contenedor-principal">


        <!-- ======================================== -->
        <!-- SECCION PRODUCTOS -->
        <!-- ======================================== -->

        <section class="contenedor-productos">

            <!-- TITULO DINAMICO -->
            <div id="tituloCompraTotal" style="display: none;" class="titulo-categoria">
                <h2 id="titulo_carrito">Carrito de Compras</h2>
            </div><br>


            <!-- GRID PRODUCTOS -->
            <div class="grid-productos" id="gridProductos">

                <!-- TARJETA PRODUCTO -->
                <!-- Se cargan automáticamente -->

            </div>

        </section>

        
        <aside class="total_productos" id="resumenCompra">
            <!-- RESUMEN COMPRA -->
        </aside>

    </main>



     <!-- ======================================== -->
    <!-- MODAL LOGIN -->
    <!-- ======================================== -->

    <div class="modal-login oculto" id="modalLogin">

        <div class="contenido-modal">

            <div class="cerrar-modal" id="cerrarLogin">
                X
            </div>

            <h2>Iniciar sesión</h2>

            <form>

                <input type="email" id="correoLogin"
                       placeholder="Correo electrónico">

                <input type="password" id="claveLogin"
                       placeholder="Contraseña">

                <button     
                type="button"
                class="btn-modal"
                id="btnIngresar">
                    Ingresar
                </button>

            </form>

            <hr>

            <h3>¿No tienes cuenta?</h3>

            <button id="btnRegistrar">
                Registrarse
            </button>

        </div>

    </div>


    <!-- ======================================== -->
    <!-- MODAL REGISTRO -->
    <!-- ======================================== -->

    <div class="modal-login oculto" id="modalRegistro">

        <div class="contenido-modal">

            <div class="cerrar-modal" id="cerrarRegistro">
                X
            </div>

            <h2>Crear cuenta</h2>

            <form>

                <input type="text" id="nombreRegistro"
                placeholder="Nombre completo">

                <input type="email" id="correoRegistro"
                placeholder="Correo electrónico">

                <input type="tel" id="telefonoRegistro"
                placeholder="Teléfono">

                <input type="password" id="passwordRegistro"
                placeholder="Contraseña">

                <button     
                type="button"
                class="btn-modal"
                id="btnCrearCuenta">
                    Registrarse
                </button>

            </form>

            <hr>

            <h3>¿Ya tienes cuenta?</h3>

            <button id="btnVolverLogin">
                Volver al login
            </button>

        </div>

    </div>


    <!-- ======================================== -->
    <!-- JAVASCRIPT -->
    <!-- ======================================== -->
    <script src="js/mostrarAlerta.js"></script>
    <script src="js/modal_login.js"></script>
    <script src="js/modal_registro.js"></script>
    <script src="js/carrito.js"></script>
    
    <div id="contenedor-alertas"></div>
</body>
</html>
