<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Prueba Mock WebPay</title>

    <style>
        body{
            font-family: Arial, sans-serif;
            margin:40px;
        }

        button{
            padding:10px 18px;
            margin-right:10px;
            margin-bottom:20px;
            cursor:pointer;
        }

        #resultado{
            border:1px solid #ccc;
            padding:15px;
            background:#f5f5f5;
            white-space:pre-wrap;
        }
    </style>

</head>

<body>

<h2>Pruebas Mock - Integración WebPay</h2>

<button onclick="mockExitoso()">
    Pago Exitoso
</button>

<button onclick="mockError()">
    Pago con Error
</button>

<div id="resultado"></div>

<script>

function mockExitoso(){

    const respuestaMock = {

        token:"TOKEN_PRUEBA_123456",

        url:"https://webpay.mock.cl"

    };

    let salida="";

    salida += "=== RESPUESTA MOCK EXITOSA ===\n\n";

    salida += "Token:\n";
    salida += respuestaMock.token + "\n\n";

    salida += "URL:\n";
    salida += respuestaMock.url + "\n\n";

    salida += "Resultado:\n";
    salida += "La aplicación procesó correctamente la respuesta simulada.";

    document.getElementById("resultado").textContent = salida;

    console.log(respuestaMock);

}

function mockError(){

    const respuestaMock = {

        error:"Servicio WebPay no disponible"

    };

    let salida="";

    salida += "=== RESPUESTA MOCK DE ERROR ===\n\n";

    salida += "Mensaje recibido:\n";
    salida += respuestaMock.error + "\n\n";

    salida += "Resultado:\n";
    salida += "La aplicación detectó correctamente el error simulado.";

    document.getElementById("resultado").textContent = salida;

    console.log(respuestaMock);

}

</script>

</body>

</html>
