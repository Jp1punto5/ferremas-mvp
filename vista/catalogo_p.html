<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferremas - Catálogo</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/main.css">

    <!-- ICONOS -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <!-- ======================================== -->
    <!-- HEADER PRINCIPAL -->
    <!-- ======================================== -->

    <header class="header-principal">

        <!-- LOGO FERREMAS -->
        <div class="contenedor-logo">
            <img src="img/logo-ferremas.png"
                 alt="Logo Ferremas"
                 class="logo-ferremas">
        </div>

        <!-- TITULO -->
        <div class="contenedor-titulo">
            <h1>Ferremas</h1>
            <p>Catálogo de productos</p>
        </div>

        <!-- CARRITO -->
        <div class="contenedor-carrito">

            <button class="boton-carrito">
                <i class="fa-solid fa-cart-shopping"></i>

                <span id="contador-carrito">
                    0
                </span>
            </button>

        </div>

    </header>


    <!-- ======================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ======================================== -->

    <main class="contenedor-principal">

        <!-- ======================================== -->
        <!-- MENU CATEGORIAS -->
        <!-- ======================================== -->

        <aside class="menu-categorias">

            <h2>Categorías</h2><br>

            <ul>
                <li>
                    <button class="categoria-btn" data-categoria="Herramientas">
                        Herramientas
                    </button>
                </li>

                <li>
                    <button class="categoria-btn" data-categoria="Electricidad">
                        Electricidad
                    </button>
                </li>

                <li>
                    <button class="categoria-btn" data-categoria="Construcción">
                        Construcción
                    </button>
                </li>

                <li>
                    <button class="categoria-btn" data-categoria="Pintura">
                        Pintura
                    </button>
                </li>

                <li>
                    <button class="categoria-btn" data-categoria="Jardinería">
                        Jardinería
                    </button>
                </li>

                <li>
                    <button class="categoria-btn" data-categoria="Seguridad">
                        Seguridad
                    </button>
                </li>
            </ul>

        </aside>


        <!-- ======================================== -->
        <!-- SECCION PRODUCTOS -->
        <!-- ======================================== -->

        <section class="contenedor-productos">

            <!-- TITULO DINAMICO -->
            <div class="titulo-categoria">
                <h2>Productos destacados</h2>
            </div><br>


            <!-- GRID PRODUCTOS -->
            <div class="grid-productos" id="gridProductos">

                <!-- TARJETA PRODUCTO se cargan automaticamente -->

            </div>

        </section>

    </main>
    <!-- ======================================== -->
    <!-- JAVASCRIPT -->
    <!-- ======================================== -->
    <script src="js/mostrarAlerta.js"></script>
    <script src="js/carrito.js"></script>
    <script src="js/cargar_imagen.js"></script>

    <div id="contenedor-alertas"></div>
    
</body>
</html>
